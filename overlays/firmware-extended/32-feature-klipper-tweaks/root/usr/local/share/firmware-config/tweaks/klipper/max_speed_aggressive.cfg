# tier: aggressive
# Max Speed (Aggressive) - High-Speed XY Motion and Fast Tool Changes
# Origin: https://github.com/JNP-1/Snapmaker-U1-Config
# Values as proposed by @justinh-rahb in #679.
# Raises the XY motion limits and tool change speeds, together with the TMC2240
# chopper tuning that keeps the XY drivers stable at those speeds.
#
# WARNING: Only enable this on a fully calibrated printer. Dock positions and
# belt tension must be correct and tool changes must already be reliable with
# the stock configuration. On an uncalibrated printer expect crashes into the
# docks, layer shifts and skipped steps. Start with the Balanced tier.
#
# square_corner_velocity affects every direction change in a print, so raising it
# can show up as ringing on walls if input shaper is not calibrated.
#
# Input shaper values are printer specific and are deliberately not part of this
# tweak. Run SHAPER_CALIBRATE and then SAVE_CONFIG.
#
# This tweak replaces TMC AutoTune and TMC Reduced Current - it changes the same
# driver registers and cannot be combined with them.

[printer]
max_velocity: 750  # stock: 500
max_accel: 25000  # stock: 20000
square_corner_velocity: 15  # stock: 8

[tmc2240 stepper_x]
run_current: 1.2  # stock current, reduced current is not safe at these speeds
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 0
driver_HSTRT: 2
driver_TPFD: 0
driver_VHIGHFS: 1
driver_VHIGHCHM: 1
driver_PWM_AUTOGRAD: False
driver_PWM_GRAD: 8
driver_PWM_OFS: 29
driver_PWM_REG: 4
driver_PWM_LIM: 8

[tmc2240 stepper_y]
run_current: 1.2  # stock current, reduced current is not safe at these speeds
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 0
driver_HSTRT: 2
driver_TPFD: 0
driver_VHIGHFS: 1
driver_VHIGHCHM: 1
driver_PWM_AUTOGRAD: False
driver_PWM_GRAD: 8
driver_PWM_OFS: 29
driver_PWM_REG: 4
driver_PWM_LIM: 8

# Faster tool changes for all four toolheads

[extruder]
fast_move_speed: 700  # stock: 400
slow_move_speed: 60  # stock: 60, stated explicitly - see docs
grab_speed: 50  # stock: 10
switch_accel: 25000  # stock: 5000

