# Both tiers install to the same extended/klipper/10_max_speed.cfg, so switching
# between them is a single overwrite and the two tiers can never both be active.
# The tier is read back from the `# tier:` marker on the first line.

settings:
  tweaks:
    items:
      max_speed:
        label: Max Speed
        description: Raises the XY motion limits and speeds up tool changes. Balanced is the recommended starting point. Requires a calibrated printer.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#max-speed
        get_cmd:
          - bash
          - -c
          - |
            CFG=/oem/printer_data/config/extended/klipper/10_max_speed.cfg
            if grep -q '^# tier: aggressive' "$CFG" 2>/dev/null; then
              echo "aggressive"
            elif grep -q '^# tier: balanced' "$CFG" 2>/dev/null; then
              echo "balanced"
            else
              echo "disabled"
            fi
        options:
          balanced:
            label: Balanced
            confirm: "Enable Max Speed (Balanced)? This raises XY velocity to 600 mm/s, acceleration to 22000 mm/s², tool change speed to 550 mm/s, tool change acceleration to 12000 mm/s² and dock grab speed to 20 mm/s. Only enable this if dock positions and belt tension are calibrated and tool changes are already reliable. Cannot be combined with TMC AutoTune or TMC Reduced Current."
            cmd:
              - bash
              - -xc
              - |
                if test -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg; then
                  echo "ERROR: TMC AutoTune is enabled and changes the same TMC2240 driver settings."
                  echo "Disable TMC AutoTune first, then enable Max Speed."
                  exit 1
                fi
                if test -f /oem/printer_data/config/extended/klipper/tmc_current.cfg; then
                  echo "ERROR: TMC Reduced Current is enabled and lowers the X/Y motor current."
                  echo "Disable TMC Reduced Current first, then enable Max Speed."
                  exit 1
                fi
                cp -v /usr/local/share/firmware-config/tweaks/klipper/max_speed_balanced.cfg /oem/printer_data/config/extended/klipper/10_max_speed.cfg &&
                echo "Max Speed (Balanced) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          aggressive:
            label: Aggressive
            confirm: "Enable Max Speed (Aggressive)? This raises XY velocity to 750 mm/s, acceleration to 25000 mm/s², tool change speed to 700 mm/s, tool change acceleration to 25000 mm/s² and dock grab speed to 40 mm/s. Start with Balanced and only move to Aggressive once tool changes are reliable there. Otherwise expect crashes into the docks, layer shifts and skipped steps. Cannot be combined with TMC AutoTune or TMC Reduced Current."
            cmd:
              - bash
              - -xc
              - |
                if test -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg; then
                  echo "ERROR: TMC AutoTune is enabled and changes the same TMC2240 driver settings."
                  echo "Disable TMC AutoTune first, then enable Max Speed."
                  exit 1
                fi
                if test -f /oem/printer_data/config/extended/klipper/tmc_current.cfg; then
                  echo "ERROR: TMC Reduced Current is enabled and lowers the X/Y motor current."
                  echo "Disable TMC Reduced Current first, then enable Max Speed."
                  exit 1
                fi
                cp -v /usr/local/share/firmware-config/tweaks/klipper/max_speed_aggressive.cfg /oem/printer_data/config/extended/klipper/10_max_speed.cfg &&
                echo "Max Speed (Aggressive) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: Disabled
            cmd:
              - bash
              - -xc
              - |
                rm -vf /oem/printer_data/config/extended/klipper/10_max_speed.cfg &&
                echo "Max Speed disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
