# tier: balanced
# Max Speed (Balanced) - Raised XY Motion and Faster Tool Changes
# Origin: https://github.com/JNP-1/Snapmaker-U1-Config (Aggressive tier), reduced here
# The conservative tier. Raises the XY motion limits and tool change speeds,
# together with the TMC2240 chopper tuning that keeps the XY drivers stable.
#
# The tool change values sit at roughly half of the point where tool confirmation
# retries were observed, keeping a wider margin than the Aggressive tier on the
# motions that drive the head into the dock.
#
# WARNING: Only enable this on a calibrated printer. Dock positions and belt
# tension must be correct and tool changes must already be reliable with the
# stock configuration.
#
# square_corner_velocity affects every direction change in a print, so raising it
# can show up as ringing on walls if input shaper is not calibrated.
#
# Input shaper values are printer specific and are deliberately not part of this
# tweak. Run SHAPER_CALIBRATE and then SAVE_CONFIG.
#
# This tweak replaces TMC AutoTune and TMC Reduced Current - it changes the same
# driver registers and cannot be combined with them.

[printer]
max_velocity: 600  # stock: 500
max_accel: 22000  # stock: 20000
square_corner_velocity: 10  # stock: 8

[tmc2240 stepper_x]
run_current: 1.2  # stock current, reduced current is not safe at these speeds
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 0
driver_HSTRT: 2
driver_TPFD: 0
driver_VHIGHFS: 1
driver_VHIGHCHM: 1
driver_PWM_AUTOGRAD: False
driver_PWM_GRAD: 8
driver_PWM_OFS: 29
driver_PWM_REG: 4
driver_PWM_LIM: 8

[tmc2240 stepper_y]
run_current: 1.2  # stock current, reduced current is not safe at these speeds
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 0
driver_HSTRT: 2
driver_TPFD: 0
driver_VHIGHFS: 1
driver_VHIGHCHM: 1
driver_PWM_AUTOGRAD: False
driver_PWM_GRAD: 8
driver_PWM_OFS: 29
driver_PWM_REG: 4
driver_PWM_LIM: 8

# Faster tool changes for all four toolheads

[extruder]
fast_move_speed: 550  # stock: 400
slow_move_speed: 40  # stock: 60, deliberately lower - see docs
grab_speed: 30  # stock: 10
switch_accel: 12000  # stock: 5000

